---
alias: LCVP
title: The Leipzig Catalogue of Vascular Plants
description: |-
  The Leipzig Catalogue of Vascular Plants (LCVP) is as far as we know the most updated and resolved list of plant names
  and their synonyms of all known vascular plant species on this planet.
  It provides an updated and much improved reference list for all described vascular plant species globally.
  We used ~4,500 publications, existing relevant databases and available studies on molecular phylogenetics to
  construct a robust reference backbone.
  A guiding principle during the compilation of the LCVP was to avoid polyphyletic genera, which are frequent in TPL,
  either by splitting genera (e.g. separating Goeppertia from Calathea) or fusing them (e.g. Stapelia and Duvalia in Ceropegia).
  However, we did not recombine any species name in the LCVP and in cases of unclear phylogenetic position of genera,
  we used the conservative (i.e. existing) name.
  Hybrids were not the focus of the LCVP and are only marked as such, without information on their parent taxa.

  For details on methods see Freiberg et al. (2020), https://doi.org/10.1038/s41597-020-00702-z.
  The full literature package used to decide on the status of names is available from the iDiv Data Repository
  at https://idata.idiv.de/ddm/Data/ShowData/1806.

alias: DAD-IS
title: Domestic Animal Diversity Information System (DAD-IS)
description: |-
  The Domestic Animal Diversity Information System (DAD-IS) of the Food and Agriculture Organization of the
  United Nations (FAO) is the global information system on animal genetic resources for food and agriculture.
  National coordinators of more than 180 countries report their national breed populations of about 40 livestock
  species, with data on their origin, uses, population size and risk status. DAD-IS is the basis of the
  Sustainable Development Goal indicators 2.5.1 and 2.5.2 on the conservation of animal genetic resources.

  This dataset lists the livestock species of DAD-IS with their breeds. DAD-IS names its species by common name
  only; their scientific names and classification were added by the Catalogue of Life. Some DAD-IS species are
  groups of several species and are placed at genus or family level (Deer, Partridge, Pheasant, Quail, Goose,
  Fox, Swallow). Each breed is listed as a name of rank breed under its species, in the form Bos taurus 'Jersey'.
  Breeds are recognised across countries by the transboundary breed name a country gave, or else by their name,
  ignoring case, accents and punctuation. Every national breed population is given as a distribution of its breed,
  with its native or exotic status and its FAO risk status mapped to the closest IUCN category.
  The national breed names are given as vernacular names and the uses of a breed as taxon properties.
  National populations that only carry the name of their species are distributions of the species.
  Bees are reported to DAD-IS by their scientific names and are given as such, with their countries.

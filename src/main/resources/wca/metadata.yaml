alias: WCA 2030 crops
title: Crops of the World Programme for the Census of Agriculture 2030
description: |-
  The crops of the FAO World Programme for the Census of Agriculture 2030 (WCA 2030), which guides the national
  censuses of agriculture carried out between 2026 and 2035.
  The data comes from Annex 7 of the WCA 2030, the alphabetical list of about 300 crops with their botanical names
  and their codes in the Indicative Crop Classification (ICC) and the Central Product Classification (CPC).

  Every botanical name is listed once, with the crop names as English vernacular names. The ICC 1.2 and ICC 1.1
  codes, the CPC 3.0 codes and the temporary or permanent crop type are given as taxon properties, each naming
  the crops it applies to. The ICC groups crops by product and use, not by their botany (Annex 6), so it is not
  used as a classification: all plants are placed in Tracheophyta, the mushrooms and truffles in Fungi.

  This adaptation was not created by the Food and Agriculture Organization of the United Nations (FAO).
  FAO is not responsible for the content or accuracy of this adaptation.
  The original English edition shall be the authoritative edition.
